<mat-card class="user-data" appearance="outlined">
    <mat-card-header class="user-data-header">
        <mat-card-title class="user-data-title"> Meus dados</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form">
            <mat-form-field class="full-width">
                <mat-label>Nome</mat-label>
                <input matInput formControlName="nome">
            </mat-form-field>
            <mat-form-field class="full-width">
                <mat-label>E-mail</mat-label>
                <input matInput formControlName="email">
            </mat-form-field>
        </form>
    </mat-card-content>
    <mat-card-actions>
        <button matButton>Learn More</button>
    </mat-card-actions>
</mat-card>
