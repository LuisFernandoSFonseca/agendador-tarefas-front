<mat-toolbar class="app-top-menu-toolbar">
    <span class="logo">
        <a routerLink="/">
            <img [src]="appLogo" alt="Logo" class="logo-img" />
        </a>
    </span>

    @if(!isLoggedIn){
    <span class="spacer"></span>

    <a mat-button>Preços</a>
    <a mat-button>Contatos</a>

    <span class="spacer"></span>

    <button mat-button [disabled]="isOnRouteLogin()" routerLink="/login">Entrar</button>
    <button mat-flat-button [disabled]="isOnRouteRegister()" routerLink="/register">Cadastrar-se</button>
    }

    @if(isLoggedIn){
    <div matButton [matMenuTriggerFor]="menu" mat-card-avatar class="avatar-user">{{getUserInitial()}}</div>
    <mat-menu #menu="matMenu">
        <button mat-menu-item>Meus dados</button>
        <button mat-menu-item (click)="logout()">Sair</button>
    </mat-menu>
    }

</mat-toolbar>
